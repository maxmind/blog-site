name: Precious
permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  code-formatting:
    runs-on: ubuntu-latest
    name: Code Formatting
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Always lint the whole repo, on both PRs and pushes to main. Linting
      # only the files changed in a PR would miss reformats caused by the PR
      # itself -- e.g. a dependency bump that changes a formatter's version can
      # reformat files outside the diff, which would then slip past PR CI and
      # only break on push to main. The repo is small, so linting everything is
      # cheap.
      - name: Lint files
        run: precious lint --all
