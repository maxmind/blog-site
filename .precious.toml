[commands.prettier-content]
type = "both"
cmd = [
  "pnpm",
  "exec",
  "prettier",
  "--write"
]
invoke = "once"
lint-flags = ["--check"]
tidy-flags = ["--write"]
path-args = "absolute-file"
include = ["content/**/**/*.md"]
ok-exit-codes = 0

[commands.prettier-scripts]
type = "both"
cmd = [
  "pnpm",
  "exec",
  "prettier",
  "--write"
]
invoke = "once"
lint-flags = ["--check"]
tidy-flags = ["--write"]
path-args = "absolute-file"
include = ["assets/js/**"]
ok-exit-codes = 0

[commands.eslint-scripts]
type = "both"
cmd = [
  "pnpm",
  "exec",
  "eslint",
  "."
]
invoke = "once"
lint-flags = ["--max-warnings=0"]
tidy-flags = ["--fix"]
# The command already targets the whole project with `.`, so path args would
# only make it relint named files. Keep it that way now that warnings are
# fatal: ESLint reports an explicitly-named file that it is configured to
# ignore as a warning, so passing paths would fail on anything added to
# eslint.config.mjs's ignore list.
path-args = "none"
include = ["assets/js/**"]
ok-exit-codes = 0

[commands.tsc-scripts]
type = "lint"
cmd = [
  "pnpm",
  "exec",
  "tsc",
  "--noEmit"
]
invoke = "once"
path-args = "none"
include = ["assets/js/**/*.{ts}"]
ok-exit-codes = 0


[commands.stylelint-styles]
type="both"
cmd = [
  "pnpm",
  "exec",
  "stylelint"
]
invoke = "once"
lint-flags = []
tidy-flags = ["--fix"]
path-args = "absolute-file"
include = ["assets/scss/**"]
ok-exit-codes = 0

[commands.cspell-content]
type="lint"
include = ["*.md"]
cmd = [
  "pnpm",
  "run",
  "lint:cspell",
]
invoke = "once"
# The lint:cspell script supplies its own glob, so it needs no path args.
path-args = "none"
ok-exit-codes = 0

[commands.check-internal-links]
type = "lint"
cmd = [
  "pnpm",
  "run",
  "lint:internal-links"
]
invoke = "once"
path-args = "absolute-file"
include = ["content/**/*.md", "layouts/**/*.html"]
ok-exit-codes = 0
